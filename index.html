<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高等数学课堂提问计分系统 | 隐私保护版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e2a, #1a2980);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .password-section {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .password-section h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
            color: #a3d9ff;
        }
        
        .password-section input {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            margin-right: 10px;
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .password-section input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.5);
        }
        
        .password-section button {
            padding: 10px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .password-section button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .main-content {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .image-container {
            margin: 15px auto 20px;
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.7);
            overflow: hidden;  /* 确保马赛克canvas完全在圆形容器内 */
        }
        
        .image-container.no-border {
            background: transparent;
            border: none;
            box-shadow: none;
        }
        
        .student-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            position: relative;
            z-index: 2;
        }
        
        /* 马赛克Canvas层，覆盖在原始图片上方 */
        .mosaic-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 5;
            display: none;
        }
        
        .student-name-in-image {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
            display: none;
            text-align: center;
            width: 100%;
            position: absolute;
            z-index: 3;
        }
        
        @keyframes imageGlow {
            0% { 
                box-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
            }
            100% { 
                box-shadow: 0 0 50px rgba(79, 172, 254, 0.9);
            }
        }
        
        .student-display {
            height: 60px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }
        
        .student-display.hidden {
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            overflow: hidden;
        }
        
        .student-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            transition: all 0.3s ease;
            position: absolute;
            width: 100%;
            text-align: center;
        }
        
        .student-name.rolling {
            animation: rollEffect 0.1s linear infinite;
        }
        
        @keyframes rollEffect {
            0% { transform: translateY(100%); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        
        .student-name.selected {
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
        }
        
        @keyframes selectedEffect {
            0% { transform: scale(0.95); text-shadow: 0 0 15px rgba(255, 235, 59, 0.7); }
            100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 235, 59, 0.9); }
        }
        
        .controls {
            margin: 20px 0 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .controls button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .controls button.stop {
            background: linear-gradient(to right, #ff5e7d, #ff8a00);
        }
        
        .controls button.specify {
            background: linear-gradient(to right, #9c27b0, #e91e63);
        }
        
        .controls button.scoreboard {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }
        
        .specify-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .specify-section h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: #a3d9ff;
        }
        
        .specify-section select {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 200px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffeb3b;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .specify-section button {
            padding: 8px 20px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #9c27b0, #e91e63);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .score-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .score-section h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: #a3d9ff;
        }
        
        .score-section input {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 150px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .score-section button {
            padding: 8px 20px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .message {
            font-size: 1.4rem;
            margin: 15px 0;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.7);
            animation: messagePulse 2s infinite alternate;
        }
        
        @keyframes messagePulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .celebration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: firework 1.5s ease-out forwards;
        }
        
        @keyframes firework {
            0% { transform: translate(var(--x), var(--y)); width: 5px; height: 5px; opacity: 1; }
            50% { width: 5px; height: 5px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }
        
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="yellow" d="M12,2L9,12L2,12L10,17L7,22L12,17L17,22L14,17L22,12L15,12L12,2Z"/></svg>') no-repeat center;
            background-size: contain;
            animation: sparkle 2s infinite alternate;
        }
        
        @keyframes sparkle {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        }
        
        .score-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .score-display {
            font-size: 6rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: scoreAnimation 4s ease-out forwards;
            position: absolute;
            opacity: 0;
        }
        
        @keyframes scoreAnimation {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            20% { transform: scale(1.2) translateY(-20px); opacity: 1; }
            40% { transform: scale(1.5) translateY(-40px); opacity: 1; }
            60% { transform: scale(1.2) translateY(-80px); opacity: 0.8; }
            80% { transform: scale(0.8) translateY(-120px); opacity: 0.5; }
            100% { transform: scale(0.5) translateY(-160px); opacity: 0; }
        }
        
        .system-info {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .save-status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #4caf50;
            display: none;
        }

        /* GitHub Token 设置区域 */
        .github-token-section {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 100;
            width: 250px;
            transition: all 0.3s ease;
        }

        .github-token-section.collapsed {
            width: 40px;
            height: 40px;
            overflow: hidden;
        }

        .token-toggle {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .token-content h4 {
            margin-bottom: 8px;
            color: #a3d9ff;
            font-size: 0.85rem;
        }

        .token-content input {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            font-size: 0.75rem;
        }

        .token-content button {
            width: 100%;
            padding: 6px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .token-status {
            margin-top: 6px;
            font-size: 0.65rem;
            color: #4caf50;
            display: none;
        }

        .scoreboard-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .scoreboard-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            min-width: 500px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scoreboard-header h2 {
            color: #ffeb3b;
            font-size: 1.6rem;
        }

        .scoreboard-buttons {
            display: flex;
            gap: 10px;
        }

        .download-scoreboard, .refresh-scoreboard {
            background: linear-gradient(to right, #ff9800, #ff5722);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .refresh-scoreboard {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }

        .close-scoreboard {
            background: none;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .scoreboard-table th, .scoreboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .scoreboard-table th {
            background: rgba(255, 255, 255, 0.1);
            color: #ffeb3b;
        }

        .image-preload {
            display: none;
        }
        
        .preload-status {
            margin-top: 10px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="celebration" id="celebration"></div>
    <div class="score-animation" id="scoreAnimation"></div>
    <div class="container">
        <h1>高等数学课堂提问计分系统</h1>
        <div class="password-section" id="passwordSection">
            <h2>请输入密码启动系统</h2>
            <input type="password" id="passwordInput" placeholder="请输入密码">
            <button id="submitPassword">确认</button>
        </div>
        <div class="main-content" id="mainContent">
            <div class="image-container" id="imageContainer">
                <img class="student-image" id="studentImage" alt="学生头像">
                <canvas class="mosaic-canvas" id="mosaicCanvas"></canvas>
                <div class="student-name-in-image" id="studentNameInImage"></div>
            </div>
            <div class="student-display" id="studentDisplay">
                <div class="student-name" id="studentName"></div>
            </div>
            <div class="message" id="message"></div>
            <div class="controls">
                <button id="startBtn">开始点名</button>
                <button id="stopBtn" class="stop">停止点名</button>
                <button id="specifyBtn" class="specify">指定学生</button>
                <button id="scoreboardBtn" class="scoreboard">得分榜</button>
            </div>
            <div class="specify-section" id="specifySection">
                <h3>请选择要指定的学生</h3>
                <select id="studentSelect"></select>
                <button id="confirmSpecify">确认指定</button>
            </div>
            <div class="score-section" id="scoreSection">
                <h3>请为 <span id="scoringStudent"></span> 同学打分</h3>
                <input type="number" id="scoreInput" min="-100" max="100" placeholder="输入分数 (-100到100)">
                <button id="submitScore">提交分数</button>
                <div class="save-status" id="saveStatus"></div>
            </div>
            <div class="system-info"><p>系统提示：点击开始点名随机选择，停止点名确定人选，照片自动马赛克处理，姓名仅显示姓氏+星号(可配置)</p></div>
        </div>
    </div>
    <div class="image-preload" id="imagePreload"></div>
    <div class="github-token-section collapsed" id="githubTokenSection">
        <button class="token-toggle" id="tokenToggle">⚙️</button>
        <div class="token-content">
            <h4>GitHub Token 设置</h4>
            <input type="password" id="githubTokenInput" placeholder="输入 GitHub Token">
            <button id="saveToken">保存 Token</button>
            <div class="token-status" id="tokenStatus"></div>
        </div>
    </div>
    <div class="scoreboard-modal" id="scoreboardModal">
        <div class="scoreboard-content">
            <div class="scoreboard-header">
                <h2>学生得分榜</h2>
                <div class="scoreboard-buttons">
                    <button class="download-scoreboard" id="downloadScoreboard">📥 下载</button>
                    <button class="refresh-scoreboard" id="refreshScoreboard">刷新</button>
                    <button class="close-scoreboard" id="closeScoreboard">&times;</button>
                </div>
            </div>
            <div id="scoreboardData"><div class="loading-message">加载中...</div></div>
        </div>
    </div>
    <script>
        // ==================== 隐私保护配置开关 ====================
        // 如需完全显示真实姓名(不脱敏)且不对照片打马赛克，只需将下方两个变量改为 false 即可，其余代码无需改动。
        const ENABLE_MOSAIC_ON_IMAGE = true;   // 是否对学生照片应用马赛克效果 (true:马赛克; false:原图)
        const ENABLE_NAME_PRIVACY = true;      // 是否对姓名脱敏 (true:仅显示姓氏+**; false:显示完整姓名)
        // ========================================================
        
        // 学生名单 (完整姓名)
        const students = ["徐若伽", "程子昂", "朱静蕾", "王硕", "邹健乐", "吴子涵", "张怡", "胡恒远", "夏天香", "谢涵","朱芮", "李欣怡", "俞光燕", "郭英姿", "张天乐", "李乐乐", "李志豪", "杨硕", "杨鋆妍", "金宇","胡文远", "胡雨欣", "常俊", "韦书成", "汤子扬", "阮家豪", "何俊杰", "单宇阳", "姚勇棋", "段海冰","唐亚", "鲍瑞锋", "蔡贤运", "方海涛", "韦宇恒", "韦嘉乐", "王昊宇", "王瑞琦", "叶啟军", "年博一","刘子龙", "刘瑞", "朱勋振", "张宇洋", "张浩宇", "李俊杰", "杨文宇", "杨树园", "杨盛浩", "唐志远","夏云勇", "谢超", "毛运朝", "韦玉", "孙耀坤", "朱行跃", "陈启睿", "姚智鹏", "韩紫嫣", "王童","叶婷婷", "童欣怡", "舒智文", "韩玉洁", "梁晖", "谭慧慧", "马鑫宇", "孔艺涵", "方玉达", "王梦云","张梦婷", "房银霏", "梁心怡", "梁宇琨", "霍浩然", "丁宇轩", "马自红", "牛好", "江海涛", "张家福","罗时武", "胡耀", "赵紫涵", "高庆鹏", "盛文涛", "卞勇乐", "朱贤涛", "张玉洁", "张鸣威", "张恒","杨佳怡", "陈家乐", "明华东", "姚猛", "项可益", "湛益阳"];
        
        // 脱敏函数: 只显示姓氏，后面用 ** 代替 (若关闭隐私则返回原名)
        function getPrivacyName(fullName) {
            if (!ENABLE_NAME_PRIVACY) return fullName;
            if (!fullName || fullName.length === 0) return "**";
            const firstChar = fullName.charAt(0);
            return firstChar + "**";
        }
        
        // 应用马赛克到Canvas (将图片马赛克化)
        function applyMosaicToImage(imgElement, canvasElement, mosaicBlockSize = 12) {
            if (!ENABLE_MOSAIC_ON_IMAGE) {
                canvasElement.style.display = 'none';
                return;
            }
            if (!imgElement.complete || imgElement.naturalWidth === 0) {
                setTimeout(() => applyMosaicToImage(imgElement, canvasElement, mosaicBlockSize), 100);
                return;
            }
            const ctx = canvasElement.getContext('2d');
            const width = imgElement.naturalWidth;
            const height = imgElement.naturalHeight;
            canvasElement.width = width;
            canvasElement.height = height;
            canvasElement.style.width = '100%';
            canvasElement.style.height = '100%';
            ctx.drawImage(imgElement, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let y = 0; y < height; y += mosaicBlockSize) {
                for (let x = 0; x < width; x += mosaicBlockSize) {
                    const w = Math.min(mosaicBlockSize, width - x);
                    const h = Math.min(mosaicBlockSize, height - y);
                    let r = 0, g = 0, b = 0, count = 0;
                    for (let dy = 0; dy < h; dy++) {
                        for (let dx = 0; dx < w; dx++) {
                            const idx = ((y + dy) * width + (x + dx)) * 4;
                            r += data[idx];
                            g += data[idx + 1];
                            b += data[idx + 2];
                            count++;
                        }
                    }
                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);
                    for (let dy = 0; dy < h; dy++) {
                        for (let dx = 0; dx < w; dx++) {
                            const idx = ((y + dy) * width + (x + dx)) * 4;
                            data[idx] = r;
                            data[idx + 1] = g;
                            data[idx + 2] = b;
                        }
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
            canvasElement.style.display = 'block';
            imgElement.style.display = 'none';
        }
        
        // 显示学生照片 (自动马赛克)
        function displayStudentImage(studentName) {
            const img = document.getElementById('studentImage');
            const canvas = document.getElementById('mosaicCanvas');
            img.src = `images/${studentName}.jpg`;
            img.onload = () => {
                if (ENABLE_MOSAIC_ON_IMAGE) {
                    applyMosaicToImage(img, canvas, 14);
                } else {
                    canvas.style.display = 'none';
                    img.style.display = 'block';
                }
            };
            img.onerror = () => {
                console.warn(`头像加载失败: ${studentName}`);
                if (ENABLE_MOSAIC_ON_IMAGE) canvas.style.display = 'none';
                else img.style.display = 'none';
            };
        }
        
        // GitHub配置 (与之前一致)
        const GITHUB_CONFIG = { owner: "QingYH", repo: "RandRoll" };
        let scoreboardDataCache = null;
        let isRolling = false, rollInterval, selectedStudent = '', audio;
        
        // 辅助函数: 保存分数、Token等(保持原有逻辑，仅修改姓名显示脱敏)
        function getGitHubToken() { return localStorage.getItem('githubToken'); }
        function saveGitHubToken(token) { localStorage.setItem('githubToken', token); showTokenStatus('Token 已保存'); }
        function showTokenStatus(msg) { const el = document.getElementById('tokenStatus'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
        
        async function saveScoreToGitHub(studentName, score) {
            const token = getGitHubToken();
            if (!token) { showSaveStatus(false, '请先设置GitHub Token'); return false; }
            const record = { name: studentName, score: score, date: new Date().toLocaleString('zh-CN') };
            const filename = `records/${studentName}.txt`;
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodeURIComponent(filename)}`, { headers: { 'Authorization': `token ${token}` } });
                let existingContent = '', sha = null;
                if (checkRes.ok) { const fileData = await checkRes.json(); sha = fileData.sha; existingContent = decodeURIComponent(escape(atob(fileData.content))); }
                const newRecord = `姓名：${record.name}\n分数：${record.score}\n日期：${record.date}\n${'-'.repeat(30)}\n`;
                const newContent = existingContent + newRecord;
                const encodedContent = btoa(unescape(encodeURIComponent(newContent)));
                const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodeURIComponent(filename)}`, { method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify({ message: `Add score for ${studentName}`, content: encodedContent, sha: sha }) });
                if (res.ok) { showSaveStatus(true, '分数已保存！'); showScoreAnimation(score); await updateScoreboardCache(); return true; }
                else { showSaveStatus(false, '保存失败'); return false; }
            } catch(e) { showSaveStatus(false, `网络错误`); return false; }
        }
        function showSaveStatus(success, msg) { const el = document.getElementById('saveStatus'); el.textContent = msg; el.style.color = success ? '#4caf50' : '#f44336'; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 5000); }
        function showScoreAnimation(score) { const container = document.getElementById('scoreAnimation'); const div = document.createElement('div'); div.classList.add('score-display'); div.textContent = (score > 0 ? '+' : '') + score; container.appendChild(div); setTimeout(() => div.remove(), 4000); }
        
        async function getScoreboardData() {
            const token = getGitHubToken();
            if (!token) return { error: '请先设置GitHub Token' };
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/records`, { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) return { error: 'records目录不存在' };
                const files = await res.json(); const scoreMap = new Map();
                for (const file of files) {
                    if (file.name.endsWith('.txt')) {
                        const contentRes = await fetch(file.download_url);
                        const content = await contentRes.text();
                        const studentFileName = file.name.replace('.txt', '');
                        const records = content.split('-'.repeat(30));
                        for (const record of records) {
                            const lines = record.split('\n');
                            let score = 0;
                            for (const line of lines) if (line.trim().startsWith('分数：')) { score = parseInt(line.replace('分数：', '').trim()); break; }
                            if (!isNaN(score)) scoreMap.set(studentFileName, (scoreMap.get(studentFileName) || 0) + score);
                        }
                    }
                }
                const arr = Array.from(scoreMap.entries()).map(([n, s]) => ({ name: n, totalScore: s })).sort((a,b)=>b.totalScore - a.totalScore);
                return { data: arr };
            } catch(e) { return { error: e.message }; }
        }
        async function updateScoreboardCache() { const res = await getScoreboardData(); scoreboardDataCache = res.data || []; }
        async function showScoreboard() { document.getElementById('scoreboardModal').style.display = 'block'; await updateScoreboardCache(); renderScoreboard(scoreboardDataCache || []); }
        function renderScoreboard(data) {
            const container = document.getElementById('scoreboardData');
            if (!data.length) { container.innerHTML = '<div class="loading-message">暂无数据</div>'; return; }
            let html = `<table class="scoreboard-table"><thead><tr><th>排名</th><th>姓名</th><th>总分</th></tr></thead><tbody>`;
            data.forEach((item, idx) => {
                // 得分榜同样应用姓名脱敏规则
                const displayName = getPrivacyName(item.name);
                html += `<tr><td>${idx+1}</td><td>${displayName}</td><td>${item.totalScore}</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        function createStars() { for(let i=0;i<150;i++){const s=document.createElement('div');s.classList.add('star');s.style.cssText=`width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;document.getElementById('stars').appendChild(s);} }
        function createFireworks() { /* 原有效果简化保留 */ const cel = document.getElementById('celebration'); cel.style.display='block'; setTimeout(()=>cel.style.display='none',4000); }
        function createSparkles() { /* 保留装饰 */ }
        
        function selectStudent(student) {
            selectedStudent = student;
            const displayName = getPrivacyName(student);
            document.getElementById('studentName').textContent = displayName;
            document.getElementById('studentName').classList.add('selected');
            if(audio) { audio.pause(); audio.currentTime = 0; }
            displayStudentImage(student);
            createFireworks();
            document.getElementById('message').textContent = `恭喜${displayName}同学中奖啦！`;
            const speech = new SpeechSynthesisUtterance(`恭喜${getPrivacyName(student)}同学中奖啦`); speech.lang='zh-CN'; window.speechSynthesis.speak(speech);
            setTimeout(() => {
                document.getElementById('studentImage').style.display = 'none';
                document.getElementById('mosaicCanvas').style.display = 'none';
                document.getElementById('studentDisplay').classList.add('hidden');
                document.getElementById('imageContainer').classList.add('no-border');
                const nameInImg = document.getElementById('studentNameInImage');
                nameInImg.textContent = displayName;
                nameInImg.style.display = 'block';
                document.getElementById('scoreSection').style.display = 'block';
                document.getElementById('scoringStudent').textContent = displayName;
            }, 5000);
        }
        
        function stopRolling() {
            clearInterval(rollInterval); isRolling = false;
            const studentNameEl = document.getElementById('studentName');
            studentNameEl.classList.remove('rolling');
            const randomIndex = Math.floor(Math.random() * students.length);
            selectStudent(students[randomIndex]);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            // 密码验证
            document.getElementById('submitPassword').addEventListener('click', () => {
                if(document.getElementById('passwordInput').value === 'math123') {
                    document.getElementById('passwordSection').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    updateScoreboardCache();
                } else alert('密码错误');
            });
            // 填充下拉框
            students.forEach(s => { let opt = document.createElement('option'); opt.value = s; opt.textContent = getPrivacyName(s); document.getElementById('studentSelect').appendChild(opt); });
            document.getElementById('startBtn').onclick = () => {
                if(isRolling) return;
                isRolling=true; document.getElementById('studentImage').style.display='none'; document.getElementById('mosaicCanvas').style.display='none'; document.getElementById('studentNameInImage').style.display='none'; document.getElementById('message').textContent=''; document.getElementById('scoreSection').style.display='none'; document.getElementById('specifySection').style.display='none'; document.getElementById('imageContainer').classList.remove('no-border'); document.getElementById('studentDisplay').classList.remove('hidden'); const nameEl = document.getElementById('studentName'); nameEl.classList.remove('selected'); nameEl.classList.add('rolling'); audio = new Audio('music/background.mp3'); audio.loop=true; audio.play().catch(e=>console.log); rollInterval = setInterval(()=>{ const idx = Math.floor(Math.random()*students.length); nameEl.textContent = getPrivacyName(students[idx]); }, 100); setTimeout(()=>stopRolling(),4000);
            };
            document.getElementById('stopBtn').onclick = () => { if(isRolling) stopRolling(); };
            document.getElementById('specifyBtn').onclick = () => { document.getElementById('specifySection').style.display='block'; document.getElementById('scoreSection').style.display='none'; };
            document.getElementById('confirmSpecify').onclick = () => { let sel = document.getElementById('studentSelect').value; if(sel) selectStudent(sel); else alert('请选择'); document.getElementById('specifySection').style.display='none'; };
            document.getElementById('submitScore').onclick = async () => { let score = document.getElementById('scoreInput').value; if(score===''||score<-100||score>100) alert('请输入-100~100分'); else { await saveScoreToGitHub(selectedStudent, parseInt(score)); document.getElementById('scoreInput').value=''; document.getElementById('scoreSection').style.display='none'; document.getElementById('studentDisplay').classList.remove('hidden'); document.getElementById('studentNameInImage').style.display='none'; document.getElementById('imageContainer').classList.remove('no-border'); } };
            document.getElementById('scoreboardBtn').onclick = showScoreboard;
            document.getElementById('refreshScoreboard').onclick = async () => { await updateScoreboardCache(); renderScoreboard(scoreboardDataCache||[]); };
            document.getElementById('downloadScoreboard').onclick = () => { if(!scoreboardDataCache) alert('无数据'); else { let csv = "\uFEFF排名,姓名,总分\n"; scoreboardDataCache.forEach((s,i)=>{ csv+=`${i+1},${getPrivacyName(s.name)},${s.totalScore}\n`; }); const blob = new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`得分榜.csv`; a.click(); } };
            document.getElementById('closeScoreboard').onclick = () => document.getElementById('scoreboardModal').style.display='none';
            document.getElementById('saveToken').onclick = () => { let token = document.getElementById('githubTokenInput').value; if(token) saveGitHubToken(token); else showTokenStatus('请输入Token'); };
            document.getElementById('tokenToggle').onclick = () => document.getElementById('githubTokenSection').classList.toggle('collapsed');
            if(getGitHubToken()) showTokenStatus('Token已加载');
        });
    </script>
</body>
