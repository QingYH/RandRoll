<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高等数学课堂提问计分系统 | 撒花庆祝版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e2a, #1a2980);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .password-section {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .password-section h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
            color: #a3d9ff;
        }
        
        .password-section input {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            margin-right: 10px;
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .password-section input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.5);
        }
        
        .password-section button {
            padding: 10px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .password-section button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .main-content {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .image-container {
            margin: 15px auto 20px;
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.7);
            overflow: hidden;
        }
        
        .image-container.no-border {
            background: transparent;
            border: none;
            box-shadow: none;
        }
        
        .student-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            position: relative;
            z-index: 2;
        }
        
        /* 马赛克Canvas层 */
        .mosaic-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 5;
            display: none;
        }
        
        .student-name-in-image {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
            display: none;
            text-align: center;
            width: 100%;
            position: absolute;
            z-index: 3;
        }
        
        @keyframes selectedEffect {
            0% { transform: scale(0.95); text-shadow: 0 0 15px rgba(255, 235, 59, 0.7); }
            100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 235, 59, 0.9); }
        }
        
        .student-display {
            height: 60px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }
        
        .student-display.hidden {
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            overflow: hidden;
        }
        
        .student-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            transition: all 0.3s ease;
            position: absolute;
            width: 100%;
            text-align: center;
        }
        
        .student-name.rolling {
            animation: rollEffect 0.1s linear infinite;
        }
        
        @keyframes rollEffect {
            0% { transform: translateY(100%); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        
        .student-name.selected {
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
        }
        
        .controls {
            margin: 20px 0 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .controls button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .controls button.stop {
            background: linear-gradient(to right, #ff5e7d, #ff8a00);
        }
        
        .controls button.specify {
            background: linear-gradient(to right, #9c27b0, #e91e63);
        }
        
        .controls button.scoreboard {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }
        
        .specify-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .specify-section select {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 200px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffeb3b;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .score-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .score-section input {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 150px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .message {
            font-size: 1.4rem;
            margin: 15px 0;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.7);
            animation: messagePulse 2s infinite alternate;
        }
        
        @keyframes messagePulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        /* ========== 撒花效果样式 ========== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ffeb3b, #ff9800);
            opacity: 0.9;
            animation: confettiFall 3s ease-out forwards;
            z-index: 1001;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-20vh) rotate(0deg);
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 撒花用的圆点彩纸 */
        .confetti-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: confettiFall 2.5s ease-out forwards;
        }
        
        /* 长条彩纸 */
        .confetti-rect {
            position: absolute;
            width: 12px;
            height: 6px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            animation: confettiFall 3.2s ease-out forwards;
        }
        
        /* 烟花爆炸效果容器 */
        .firework-burst {
            position: fixed;
            pointer-events: none;
            z-index: 1002;
        }
        
        .firework-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: particleExpand 1s ease-out forwards;
        }
        
        @keyframes particleExpand {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
        
        .score-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .score-display {
            font-size: 6rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: scoreAnimation 4s ease-out forwards;
            position: absolute;
            opacity: 0;
        }
        
        @keyframes scoreAnimation {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            20% { transform: scale(1.2) translateY(-20px); opacity: 1; }
            40% { transform: scale(1.5) translateY(-40px); opacity: 1; }
            60% { transform: scale(1.2) translateY(-80px); opacity: 0.8; }
            100% { transform: scale(0.5) translateY(-160px); opacity: 0; }
        }
        
        .system-info {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .save-status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #4caf50;
            display: none;
        }

        .github-token-section {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 100;
            width: 250px;
            transition: all 0.3s ease;
        }

        .github-token-section.collapsed {
            width: 40px;
            height: 40px;
            overflow: hidden;
        }

        .token-toggle {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
        }

        .token-content h4 {
            margin-bottom: 8px;
            color: #a3d9ff;
            font-size: 0.85rem;
        }

        .token-content input {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
        }

        .token-content button {
            width: 100%;
            padding: 6px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        .scoreboard-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .scoreboard-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            padding: 20px;
            border-radius: 15px;
            min-width: 500px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scoreboard-header h2 {
            color: #ffeb3b;
        }

        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scoreboard-table th, .scoreboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .image-preload { display: none; }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="score-animation" id="scoreAnimation"></div>
    <div class="container">
        <h1>高等数学课堂提问计分系统</h1>
        <div class="password-section" id="passwordSection">
            <h2>请输入密码启动系统</h2>
            <input type="password" id="passwordInput" placeholder="请输入密码">
            <button id="submitPassword">确认</button>
        </div>
        <div class="main-content" id="mainContent">
            <div class="image-container" id="imageContainer">
                <img class="student-image" id="studentImage" alt="学生头像">
                <canvas class="mosaic-canvas" id="mosaicCanvas"></canvas>
                <div class="student-name-in-image" id="studentNameInImage"></div>
            </div>
            <div class="student-display" id="studentDisplay">
                <div class="student-name" id="studentName"></div>
            </div>
            <div class="message" id="message"></div>
            <div class="controls">
                <button id="startBtn">开始点名</button>
                <button id="stopBtn" class="stop">停止点名</button>
                <button id="specifyBtn" class="specify">指定学生</button>
                <button id="scoreboardBtn" class="scoreboard">得分榜</button>
            </div>
            <div class="specify-section" id="specifySection">
                <h3>请选择要指定的学生</h3>
                <select id="studentSelect"></select>
                <button id="confirmSpecify">确认指定</button>
            </div>
            <div class="score-section" id="scoreSection">
                <h3>请为 <span id="scoringStudent"></span> 同学打分</h3>
                <input type="number" id="scoreInput" min="-100" max="100" placeholder="输入分数 (-100到100)">
                <button id="submitScore">提交分数</button>
                <div class="save-status" id="saveStatus"></div>
            </div>
            <div class="system-info"><p>✨ 中奖后自动撒花庆祝 ✨ | 照片马赛克处理 | 姓名隐私保护</p></div>
        </div>
    </div>
    <div class="image-preload" id="imagePreload"></div>
    <div class="github-token-section collapsed" id="githubTokenSection">
        <button class="token-toggle" id="tokenToggle">⚙️</button>
        <div class="token-content">
            <h4>GitHub Token 设置</h4>
            <input type="password" id="githubTokenInput" placeholder="输入 GitHub Token">
            <button id="saveToken">保存 Token</button>
            <div class="token-status" id="tokenStatus"></div>
        </div>
    </div>
    <div class="scoreboard-modal" id="scoreboardModal">
        <div class="scoreboard-content">
            <div class="scoreboard-header">
                <h2>学生得分榜</h2>
                <button class="close-scoreboard" id="closeScoreboard">&times;</button>
            </div>
            <div id="scoreboardData"></div>
        </div>
    </div>

    <script>
        // ==================== 隐私保护配置开关 ====================
        const ENABLE_MOSAIC_ON_IMAGE = true;   // true:马赛克 false:原图
        const ENABLE_NAME_PRIVACY = true;      // true:仅显示姓氏+** false:完整姓名
        // ========================================================
        
        const students = ["徐若伽", "程子昂", "朱静蕾", "王硕", "邹健乐", "吴子涵", "张怡", "胡恒远", "夏天香", "谢涵","朱芮", "李欣怡", "俞光燕", "郭英姿", "张天乐", "李乐乐", "李志豪", "杨硕", "杨鋆妍", "金宇","胡文远", "胡雨欣", "常俊", "韦书成", "汤子扬", "阮家豪", "何俊杰", "单宇阳", "姚勇棋", "段海冰","唐亚", "鲍瑞锋", "蔡贤运", "方海涛", "韦宇恒", "韦嘉乐", "王昊宇", "王瑞琦", "叶啟军", "年博一","刘子龙", "刘瑞", "朱勋振", "张宇洋", "张浩宇", "李俊杰", "杨文宇", "杨树园", "杨盛浩", "唐志远","夏云勇", "谢超", "毛运朝", "韦玉", "孙耀坤", "朱行跃", "陈启睿", "姚智鹏", "韩紫嫣", "王童","叶婷婷", "童欣怡", "舒智文", "韩玉洁", "梁晖", "谭慧慧", "马鑫宇", "孔艺涵", "方玉达", "王梦云","张梦婷", "房银霏", "梁心怡", "梁宇琨", "霍浩然", "丁宇轩", "马自红", "牛好", "江海涛", "张家福","罗时武", "胡耀", "赵紫涵", "高庆鹏", "盛文涛", "卞勇乐", "朱贤涛", "张玉洁", "张鸣威", "张恒","杨佳怡", "陈家乐", "明华东", "姚猛", "项可益", "湛益阳"];
        
        // 脱敏函数
        function getPrivacyName(fullName) {
            if (!ENABLE_NAME_PRIVACY) return fullName;
            if (!fullName || fullName.length === 0) return "**";
            return fullName.charAt(0) + "**";
        }
        
        // 应用马赛克到Canvas
        function applyMosaicToImage(imgElement, canvasElement, mosaicBlockSize = 14) {
            if (!ENABLE_MOSAIC_ON_IMAGE) {
                canvasElement.style.display = 'none';
                return;
            }
            if (!imgElement.complete || imgElement.naturalWidth === 0) {
                setTimeout(() => applyMosaicToImage(imgElement, canvasElement, mosaicBlockSize), 100);
                return;
            }
            const ctx = canvasElement.getContext('2d');
            const width = imgElement.naturalWidth;
            const height = imgElement.naturalHeight;
            canvasElement.width = width;
            canvasElement.height = height;
            canvasElement.style.width = '100%';
            canvasElement.style.height = '100%';
            ctx.drawImage(imgElement, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            for (let y = 0; y < height; y += mosaicBlockSize) {
                for (let x = 0; x < width; x += mosaicBlockSize) {
                    const w = Math.min(mosaicBlockSize, width - x);
                    const h = Math.min(mosaicBlockSize, height - y);
                    let r = 0, g = 0, b = 0, count = 0;
                    for (let dy = 0; dy < h; dy++) {
                        for (let dx = 0; dx < w; dx++) {
                            const idx = ((y + dy) * width + (x + dx)) * 4;
                            r += data[idx]; g += data[idx+1]; b += data[idx+2]; count++;
                        }
                    }
                    r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
                    for (let dy = 0; dy < h; dy++) {
                        for (let dx = 0; dx < w; dx++) {
                            const idx = ((y + dy) * width + (x + dx)) * 4;
                            data[idx] = r; data[idx+1] = g; data[idx+2] = b;
                        }
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
            canvasElement.style.display = 'block';
            imgElement.style.display = 'none';
        }
        
        // ========== 撒花效果增强函数 ==========
        let activeConfettiContainer = null;
        
        function createConfettiContainer() {
            if (activeConfettiContainer) {
                activeConfettiContainer.remove();
            }
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            activeConfettiContainer = container;
            // 5秒后自动移除容器
            setTimeout(() => {
                if (activeConfettiContainer) {
                    activeConfettiContainer.remove();
                    activeConfettiContainer = null;
                }
            }, 5000);
            return container;
        }
        
        // 生成随机颜色
        function randomColor() {
            const colors = ['#ffeb3b', '#ff9800', '#ff5722', '#4caf50', '#2196f3', '#e91e63', '#9c27b0', '#00bcd4', '#ff4081', '#7c4dff'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // 撒花主函数 - 多种彩纸效果
        function startConfettiCelebration() {
            const container = createConfettiContainer();
            const confettiCount = 180;  // 彩纸数量
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const type = Math.random() > 0.6 ? 'rect' : 'dot';
                    const confetti = document.createElement('div');
                    
                    if (type === 'dot') {
                        confetti.className = 'confetti-dot';
                        confetti.style.backgroundColor = randomColor();
                        confetti.style.width = Math.random() * 10 + 5 + 'px';
                        confetti.style.height = confetti.style.width;
                    } else {
                        confetti.className = 'confetti-rect';
                        confetti.style.backgroundColor = randomColor();
                        confetti.style.width = Math.random() * 15 + 8 + 'px';
                        confetti.style.height = Math.random() * 6 + 4 + 'px';
                        confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    }
                    
                    // 随机起始位置（从屏幕上方和两侧）
                    const startX = Math.random() * window.innerWidth;
                    const startY = -20 - Math.random() * 50;
                    confetti.style.left = startX + 'px';
                    confetti.style.top = startY + 'px';
                    
                    // 随机动画时长和延迟
                    const duration = Math.random() * 2 + 2;
                    const delay = Math.random() * 0.5;
                    confetti.style.animation = `confettiFall ${duration}s ease-out forwards`;
                    confetti.style.animationDelay = delay + 's';
                    
                    container.appendChild(confetti);
                    
                    // 动画结束后移除
                    setTimeout(() => {
                        if (confetti && confetti.remove) confetti.remove();
                    }, (duration + delay) * 1000);
                }, i * 15); // 错开生成时间，更自然
            }
            
            // 添加烟花爆炸效果（中心爆发）
            createFireworkBursts();
        }
        
        // 烟花爆炸效果 - 从中奖区域向外扩散
        function createFireworkBursts() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let burst = 0; burst < 3; burst++) {
                setTimeout(() => {
                    const particleCount = 40;
                    for (let i = 0; i < particleCount; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework-particle';
                        particle.style.backgroundColor = randomColor();
                        particle.style.left = centerX + 'px';
                        particle.style.top = centerY + 'px';
                        particle.style.position = 'fixed';
                        
                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 150 + 50;
                        const dx = Math.cos(angle) * distance;
                        const dy = Math.sin(angle) * distance;
                        particle.style.setProperty('--dx', dx + 'px');
                        particle.style.setProperty('--dy', dy + 'px');
                        
                        document.body.appendChild(particle);
                        
                        setTimeout(() => particle.remove(), 1000);
                    }
                }, burst * 200);
            }
        }
        
        // 保留原有的简单烟花效果作为补充
        function createSimpleFireworks() {
            const celebration = document.createElement('div');
            celebration.style.position = 'fixed';
            celebration.style.top = '0';
            celebration.style.left = '0';
            celebration.style.width = '100%';
            celebration.style.height = '100%';
            celebration.style.pointerEvents = 'none';
            celebration.style.zIndex = '999';
            document.body.appendChild(celebration);
            
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.style.position = 'absolute';
                    firework.style.width = '6px';
                    firework.style.height = '6px';
                    firework.style.borderRadius = '50%';
                    firework.style.backgroundColor = randomColor();
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.opacity = '0.8';
                    firework.style.animation = 'fireworkExpand 1.2s ease-out forwards';
                    celebration.appendChild(firework);
                    setTimeout(() => firework.remove(), 1200);
                }, i * 30);
            }
            
            setTimeout(() => celebration.remove(), 3000);
        }
        
        // 添加CSS动画
        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes fireworkExpand {
                0% { transform: scale(0); opacity: 1; }
                100% { transform: scale(15); opacity: 0; }
            }
        `;
        document.head.appendChild(styleSheet);
        
        // 完整庆祝特效（撒花 + 烟花）
        function fullCelebration() {
            startConfettiCelebration();
            createSimpleFireworks();
        }
        
        // 显示学生照片
        function displayStudentImage(studentName) {
            const img = document.getElementById('studentImage');
            const canvas = document.getElementById('mosaicCanvas');
            img.src = `images/${studentName}.jpg`;
            img.onload = () => {
                if (ENABLE_MOSAIC_ON_IMAGE) {
                    applyMosaicToImage(img, canvas, 14);
                } else {
                    canvas.style.display = 'none';
                    img.style.display = 'block';
                }
            };
            img.onerror = () => {
                canvas.style.display = 'none';
                img.style.display = 'none';
            };
        }
        
        // GitHub配置
        const GITHUB_CONFIG = { owner: "QingYH", repo: "RandRoll" };
        let scoreboardDataCache = null;
        let isRolling = false, rollInterval, selectedStudent = '', audio;
        
        function getGitHubToken() { return localStorage.getItem('githubToken'); }
        function showTokenStatus(msg) { const el = document.getElementById('tokenStatus'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 3000); }
        function saveGitHubToken(token) { localStorage.setItem('githubToken', token); showTokenStatus('Token已保存'); }
        
        async function saveScoreToGitHub(studentName, score) {
            const token = getGitHubToken();
            if (!token) { showSaveStatus(false, '请先设置GitHub Token'); return false; }
            const filename = `records/${studentName}.txt`;
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodeURIComponent(filename)}`, { headers: { 'Authorization': `token ${token}` } });
                let existingContent = '', sha = null;
                if (checkRes.ok) { const fileData = await checkRes.json(); sha = fileData.sha; existingContent = decodeURIComponent(escape(atob(fileData.content))); }
                const newRecord = `姓名：${studentName}\n分数：${score}\n日期：${new Date().toLocaleString()}\n${'-'.repeat(30)}\n`;
                const newContent = existingContent + newRecord;
                const encodedContent = btoa(unescape(encodeURIComponent(newContent)));
                const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodeURIComponent(filename)}`, { method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify({ message: `Add score`, content: encodedContent, sha: sha }) });
                if (res.ok) { showSaveStatus(true, '分数已保存！'); showScoreAnimation(score); await updateScoreboardCache(); return true; }
                else { showSaveStatus(false, '保存失败'); return false; }
            } catch(e) { showSaveStatus(false, '网络错误'); return false; }
        }
        
        function showSaveStatus(success, msg) { const el = document.getElementById('saveStatus'); el.textContent = msg; el.style.color = success ? '#4caf50' : '#f44336'; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 5000); }
        function showScoreAnimation(score) { const container = document.getElementById('scoreAnimation'); const div = document.createElement('div'); div.classList.add('score-display'); div.textContent = (score > 0 ? '+' : '') + score; container.appendChild(div); setTimeout(() => div.remove(), 4000); }
        
        async function getScoreboardData() {
            const token = getGitHubToken();
            if (!token) return { error: '请先设置Token' };
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/records`, { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) return { data: [] };
                const files = await res.json(); const scoreMap = new Map();
                for (const file of files) {
                    if (file.name.endsWith('.txt')) {
                        const contentRes = await fetch(file.download_url);
                        const content = await contentRes.text();
                        const studentFileName = file.name.replace('.txt', '');
                        const records = content.split('-'.repeat(30));
                        let total = 0;
                        for (const record of records) {
                            const lines = record.split('\n');
                            for (const line of lines) {
                                if (line.trim().startsWith('分数：')) {
                                    const s = parseInt(line.replace('分数：', '').trim());
                                    if (!isNaN(s)) total += s;
                                    break;
                                }
                            }
                        }
                        scoreMap.set(studentFileName, total);
                    }
                }
                const arr = Array.from(scoreMap.entries()).map(([n, s]) => ({ name: n, totalScore: s })).sort((a,b)=>b.totalScore - a.totalScore);
                return { data: arr };
            } catch(e) { return { data: [] }; }
        }
        
        async function updateScoreboardCache() { const res = await getScoreboardData(); scoreboardDataCache = res.data || []; }
        async function showScoreboard() { document.getElementById('scoreboardModal').style.display = 'block'; await updateScoreboardCache(); renderScoreboard(); }
        function renderScoreboard() { const container = document.getElementById('scoreboardData'); if (!scoreboardDataCache || !scoreboardDataCache.length) { container.innerHTML = '<div>暂无数据</div>'; return; } let html = '<table class="scoreboard-table"><tr><th>排名</th><th>姓名</th><th>总分</th></tr>'; scoreboardDataCache.forEach((item, idx) => { html += `<tr><td>${idx+1}</td><td>${getPrivacyName(item.name)}</td><td>${item.totalScore}</td></tr>`; }); html += '</table>'; container.innerHTML = html; }
        
        function createStars() { for(let i=0;i<150;i++){const s=document.createElement('div');s.classList.add('star');s.style.cssText=`width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;document.getElementById('stars').appendChild(s);} }
        
        function selectStudent(student) {
            selectedStudent = student;
            const displayName = getPrivacyName(student);
            document.getElementById('studentName').textContent = displayName;
            document.getElementById('studentName').classList.add('selected');
            if(audio) { audio.pause(); audio.currentTime = 0; }
            displayStudentImage(student);
            // 调用撒花庆祝效果！
            fullCelebration();
            document.getElementById('message').textContent = `🎉 恭喜${displayName}同学中奖啦！🎉`;
            const speech = new SpeechSynthesisUtterance(`恭喜${getPrivacyName(student)}同学中奖啦`); speech.lang='zh-CN'; window.speechSynthesis.speak(speech);
            setTimeout(() => {
                document.getElementById('studentImage').style.display = 'none';
                document.getElementById('mosaicCanvas').style.display = 'none';
                document.getElementById('studentDisplay').classList.add('hidden');
                document.getElementById('imageContainer').classList.add('no-border');
                document.getElementById('studentNameInImage').textContent = displayName;
                document.getElementById('studentNameInImage').style.display = 'block';
                document.getElementById('scoreSection').style.display = 'block';
                document.getElementById('scoringStudent').textContent = displayName;
            }, 4500);
        }
        
        function stopRolling() {
            clearInterval(rollInterval); isRolling = false;
            document.getElementById('studentName').classList.remove('rolling');
            const randomIndex = Math.floor(Math.random() * students.length);
            selectStudent(students[randomIndex]);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            document.getElementById('submitPassword').addEventListener('click', () => {
                if(document.getElementById('passwordInput').value === 'math123') {
                    document.getElementById('passwordSection').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    updateScoreboardCache();
                } else alert('密码错误');
            });
            students.forEach(s => { let opt = document.createElement('option'); opt.value = s; opt.textContent = getPrivacyName(s); document.getElementById('studentSelect').appendChild(opt); });
            document.getElementById('startBtn').onclick = () => {
                if(isRolling) return;
                isRolling=true; document.getElementById('studentImage').style.display='none'; document.getElementById('mosaicCanvas').style.display='none'; document.getElementById('studentNameInImage').style.display='none'; document.getElementById('message').textContent=''; document.getElementById('scoreSection').style.display='none'; document.getElementById('specifySection').style.display='none'; document.getElementById('imageContainer').classList.remove('no-border'); document.getElementById('studentDisplay').classList.remove('hidden'); const nameEl = document.getElementById('studentName'); nameEl.classList.remove('selected'); nameEl.classList.add('rolling'); audio = new Audio('music/background.mp3'); audio.loop=true; audio.play().catch(e=>console.log); rollInterval = setInterval(()=>{ const idx = Math.floor(Math.random()*students.length); nameEl.textContent = getPrivacyName(students[idx]); }, 100); setTimeout(()=>stopRolling(),4000);
            };
            document.getElementById('stopBtn').onclick = () => { if(isRolling) stopRolling(); };
            document.getElementById('specifyBtn').onclick = () => { document.getElementById('specifySection').style.display='block'; document.getElementById('scoreSection').style.display='none'; };
            document.getElementById('confirmSpecify').onclick = () => { let sel = document.getElementById('studentSelect').value; if(sel) selectStudent(sel); document.getElementById('specifySection').style.display='none'; };
            document.getElementById('submitScore').onclick = async () => { let score = document.getElementById('scoreInput').value; if(score===''||score<-100||score>100) alert('请输入-100~100分'); else { await saveScoreToGitHub(selectedStudent, parseInt(score)); document.getElementById('scoreInput').value=''; document.getElementById('scoreSection').style.display='none'; document.getElementById('studentDisplay').classList.remove('hidden'); document.getElementById('studentNameInImage').style.display='none'; document.getElementById('imageContainer').classList.remove('no-border'); } };
            document.getElementById('scoreboardBtn').onclick = showScoreboard;
            document.getElementById('closeScoreboard').onclick = () => document.getElementById('scoreboardModal').style.display='none';
            document.getElementById('saveToken').onclick = () => { let token = document.getElementById('githubTokenInput').value; if(token) saveGitHubToken(token); };
            document.getElementById('tokenToggle').onclick = () => document.getElementById('githubTokenSection').classList.toggle('collapsed');
        });
    </script>
</body>
</html>
