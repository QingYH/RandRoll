<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高等数学课堂提问计分系统 - 极速版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e2a, #1a2980);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .password-section {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .password-section h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
            color: #a3d9ff;
        }
        
        .password-section input {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            margin-right: 10px;
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        
        .password-section input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.5);
        }
        
        .password-section button {
            padding: 10px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .password-section button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .main-content {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .image-container {
            margin: 15px auto 20px;
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.7);
        }
        
        .image-container.no-border {
            background: transparent;
            border: none;
            box-shadow: none;
        }
        
        .student-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            filter: brightness(1.1) contrast(1.05) saturate(1.1) hue-rotate(-2deg) sepia(0.03);
            animation: imageGlow 2s infinite alternate;
            position: relative;
            z-index: 2;
        }
        
        .student-name-in-image {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
            display: none;
            text-align: center;
            width: 100%;
            position: absolute;
            z-index: 3;
        }
        
        .image-container::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .student-image.active + .image-container::before {
            opacity: 1;
        }
        
        @keyframes imageGlow {
            0% { box-shadow: 0 0 30px rgba(79, 172, 254, 0.5); filter: brightness(1.1) contrast(1.05) saturate(1.1) hue-rotate(-2deg) sepia(0.03);}
            100% { box-shadow: 0 0 50px rgba(79, 172, 254, 0.9); filter: brightness(1.15) contrast(1.1) saturate(1.15) hue-rotate(-2deg) sepia(0.05);}
        }
        
        .student-display {
            height: 60px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }
        
        .student-display.hidden {
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            overflow: hidden;
        }
        
        .student-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            transition: all 0.3s ease;
            position: absolute;
            width: 100%;
            text-align: center;
        }
        
        .student-name.rolling {
            animation: rollEffect 0.1s linear infinite;
        }
        
        @keyframes rollEffect {
            0% { transform: translateY(100%); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        
        .student-name.selected {
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: selectedEffect 3s infinite alternate;
        }
        
        @keyframes selectedEffect {
            0% { transform: scale(0.95); text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);}
            100% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 235, 59, 0.9);}
        }
        
        .controls {
            margin: 20px 0 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .controls button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .controls button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .controls button.stop {
            background: linear-gradient(to right, #ff5e7d, #ff8a00);
        }
        
        .controls button.specify {
            background: linear-gradient(to right, #9c27b0, #e91e63);
        }
        
        .controls button.scoreboard {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }
        
        .specify-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .specify-section h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: #a3d9ff;
        }
        
        .specify-section select {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 200px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffeb3b;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .specify-section button {
            padding: 8px 20px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #9c27b0, #e91e63);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .specify-section button:hover {
            transform: translateY(-2px);
        }
        
        .score-section {
            margin-top: 20px;
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
        }
        
        .score-section h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: #a3d9ff;
        }
        
        .score-section input {
            padding: 8px 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            margin-right: 10px;
            width: 150px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .score-section button {
            padding: 8px 20px;
            font-size: 1.1rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .score-section button:hover {
            transform: translateY(-2px);
        }
        
        .message {
            font-size: 1.4rem;
            margin: 15px 0;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.7);
            animation: messagePulse 2s infinite alternate;
        }
        
        @keyframes messagePulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .celebration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: firework 1.5s ease-out forwards;
        }
        
        @keyframes firework {
            0% { transform: translate(var(--x), var(--y)); width: 5px; height: 5px; opacity: 1; }
            50% { width: 5px; height: 5px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }
        
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="yellow" d="M12,2L9,12L2,12L10,17L7,22L12,17L17,22L14,17L22,12L15,12L12,2Z"/></svg>') no-repeat center;
            background-size: contain;
            animation: sparkle 2s infinite alternate;
        }
        
        @keyframes sparkle {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.2) rotate(180deg); opacity: 1; }
        }
        
        .score-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .score-display {
            font-size: 6rem;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 20px rgba(255, 235, 59, 0.8);
            animation: scoreAnimation 4s ease-out forwards;
            position: absolute;
            opacity: 0;
        }
        
        @keyframes scoreAnimation {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            20% { transform: scale(1.2) translateY(-20px); opacity: 1; }
            40% { transform: scale(1.5) translateY(-40px); opacity: 1; }
            60% { transform: scale(1.2) translateY(-80px); opacity: 0.8; }
            80% { transform: scale(0.8) translateY(-120px); opacity: 0.5; }
            100% { transform: scale(0.5) translateY(-160px); opacity: 0; }
        }
        
        .system-info {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .save-status {
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
            font-weight: bold;
            padding: 6px;
            border-radius: 6px;
            background: rgba(0,0,0,0.5);
        }

        .github-token-section {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 100;
            width: 250px;
            transition: all 0.3s ease;
        }

        .github-token-section.collapsed {
            width: 40px;
            height: 40px;
            overflow: hidden;
        }

        .github-token-section.collapsed .token-content {
            display: none;
        }

        .token-toggle {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .token-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .token-content h4 {
            margin-bottom: 8px;
            color: #a3d9ff;
            font-size: 0.85rem;
        }

        .token-content input {
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            font-size: 0.75rem;
        }

        .token-content button {
            width: 100%;
            padding: 6px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .token-content button:hover {
            opacity: 0.9;
        }

        .token-status {
            margin-top: 6px;
            font-size: 0.65rem;
            color: #4caf50;
            display: none;
        }

        .scoreboard-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .scoreboard-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            min-width: 500px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .scoreboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scoreboard-header h2 {
            color: #ffeb3b;
            font-size: 1.6rem;
        }

        .scoreboard-buttons {
            display: flex;
            gap: 10px;
        }

        .download-scoreboard, .refresh-scoreboard {
            background: linear-gradient(to right, #ff9800, #ff5722);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .refresh-scoreboard {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }

        .close-scoreboard {
            background: none;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .scoreboard-table th, .scoreboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .scoreboard-table th {
            background: rgba(255, 255, 255, 0.1);
            color: #ffeb3b;
        }

        .image-preload {
            display: none;
        }
        
        .preload-status {
            margin-top: 10px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="celebration" id="celebration"></div>
    <div class="score-animation" id="scoreAnimation"></div>
    
    <div class="container">
        <h1>高等数学课堂提问计分系统</h1>
        
        <div class="password-section" id="passwordSection">
            <h2>请输入密码启动系统</h2>
            <input type="password" id="passwordInput" placeholder="请输入密码">
            <button id="submitPassword">确认</button>
        </div>
        
        <div class="main-content" id="mainContent">
            <div class="image-container" id="imageContainer">
                <img class="student-image" id="studentImage" alt="学生头像">
                <div class="student-name-in-image" id="studentNameInImage"></div>
            </div>
            
            <div class="student-display" id="studentDisplay">
                <div class="student-name" id="studentName"></div>
            </div>
            
            <div class="message" id="message"></div>
            
            <div class="controls">
                <button id="startBtn">开始点名</button>
                <button id="stopBtn" class="stop">停止点名</button>
                <button id="specifyBtn" class="specify">指定学生</button>
                <button id="scoreboardBtn" class="scoreboard">得分榜</button>
            </div>
            
            <div class="specify-section" id="specifySection">
                <h3>请选择要指定的学生</h3>
                <select id="studentSelect"><option value="">-- 请选择学生 --</option></select>
                <button id="confirmSpecify">确认指定</button>
            </div>
            
            <div class="score-section" id="scoreSection">
                <h3>请为 <span id="scoringStudent"></span> 同学打分</h3>
                <input type="number" id="scoreInput" min="-100" max="100" placeholder="输入分数 (-100到100)">
                <button id="submitScore">提交分数</button>
                <div class="save-status" id="saveStatus"></div>
            </div>
            
            <div class="system-info">
                <p>系统提示：点击"开始点名"按钮开始随机选择学生，点击"停止点名"按钮可提前结束选择</p>
                <div class="preload-status" id="preloadStatus">得分榜实时同步 | 分数保存后自动刷新榜单</div>
            </div>
        </div>
    </div>

    <div class="image-preload" id="imagePreload"></div>

    <div class="github-token-section collapsed" id="githubTokenSection">
        <button class="token-toggle" id="tokenToggle">⚙️</button>
        <div class="token-content">
            <h4>GitHub Token 设置</h4>
            <input type="password" id="githubTokenInput" placeholder="输入 GitHub Token">
            <button id="saveToken">保存 Token</button>
            <div class="token-status" id="tokenStatus"></div>
        </div>
    </div>

    <div class="scoreboard-modal" id="scoreboardModal">
        <div class="scoreboard-content">
            <div class="scoreboard-header">
                <h2>学生得分榜</h2>
                <div class="scoreboard-buttons">
                    <button class="download-scoreboard" id="downloadScoreboard">📥 下载</button>
                    <button class="refresh-scoreboard" id="refreshScoreboard">刷新</button>
                    <button class="close-scoreboard" id="closeScoreboard">&times;</button>
                </div>
            </div>
            <div id="scoreboardData"><div class="loading-message">正在加载得分数据...</div></div>
        </div>
    </div>

    <script>
        // ==================== 学生名单 ====================
        const students = ["徐若伽","程子昂","朱静蕾","王硕","邹健乐","吴子涵","张怡","胡恒远","夏天香","谢涵","朱芮","李欣怡","俞光燕","郭英姿","张天乐","李乐乐","李志豪","杨硕","杨鋆妍","金宇","胡文远","胡雨欣","常俊","韦书成","汤子扬","阮家豪","何俊杰","单宇阳","姚勇棋","段海冰","唐亚","鲍瑞锋","蔡贤运","方海涛","韦宇恒","韦嘉乐","王昊宇","王瑞琦","叶啟军","年博一","刘子龙","刘瑞","朱勋振","张宇洋","张浩宇","李俊杰","杨文宇","杨树园","杨盛浩","唐志远","夏云勇","谢超","毛运朝","韦玉","孙耀坤","朱行跃","陈启睿","姚智鹏","韩紫嫣","王童","叶婷婷","童欣怡","舒智文","韩玉洁","梁晖","谭慧慧","马鑫宇","孔艺涵","方玉达","王梦云","张梦婷","房银霏","梁心怡","梁宇琨","霍浩然","丁宇轩","马自红","牛好","江海涛","张家福","罗时武","胡耀","赵紫涵","高庆鹏","盛文涛","卞勇乐","朱贤涛","张玉洁","张鸣威","张恒","杨佳怡","陈家乐","明华东","姚猛","项可益","湛益阳"];
        
        const GITHUB_CONFIG = { owner: "QingYH", repo: "RandRoll" };
        
        let scoreboardDataCache = null;
        let lastScoreboardUpdate = 0;
        const SCOREBOARD_CACHE_DURATION = 5000;  // 5秒缓存，大幅提高刷新速度
        
        // 异步上传队列优化：Promise并发控制
        let pendingUpload = null;
        
        function getGitHubToken() { return localStorage.getItem('githubToken'); }
        function saveGitHubToken(token) { localStorage.setItem('githubToken', token); showTokenStatus('✅ Token已保存'); }
        function showTokenStatus(msg) { const el = document.getElementById('tokenStatus'); el.textContent = msg; el.style.display='block'; setTimeout(()=>el.style.display='none',2000); }
        
        // 快速语音播报（非阻塞）
        function speakText(text) {
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                window.speechSynthesis.cancel(); // 避免堆积
                window.speechSynthesis.speak(utterance);
            } catch(e) { console.warn("语音失败",e); }
        }
        
        // 显示保存状态（更醒目）
        function showSaveStatus(success, message) {
            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            statusEl.style.backgroundColor = success ? 'rgba(76,175,80,0.2)' : 'rgba(244,67,54,0.2)';
            statusEl.style.color = success ? '#a5d6a7' : '#ffab91';
            setTimeout(() => { if(statusEl) statusEl.style.display = 'none'; }, 3000);
        }
        
        // 显示分数飘浮动画
        function showScoreAnimation(score) {
            const container = document.getElementById('scoreAnimation');
            const div = document.createElement('div');
            div.className = 'score-display';
            div.textContent = (score > 0 ? '+' : '') + score;
            div.style.color = score > 0 ? '#4caf50' : (score < 0 ? '#f44336' : '#ffeb3b');
            container.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }
        
        // 更新得分榜缓存（异步立即刷新，并发限制）
        async function updateScoreboardCache(force = true) {
            if (!force && scoreboardDataCache && (Date.now() - lastScoreboardUpdate) < SCOREBOARD_CACHE_DURATION) {
                return scoreboardDataCache;
            }
            const token = getGitHubToken();
            if (!token) return null;
            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/records`;
                const res = await fetch(url, { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
                if (!res.ok) {
                    if(res.status===404) return null;
                    throw new Error(`HTTP ${res.status}`);
                }
                const files = await res.json();
                if(!files || !files.length) { scoreboardDataCache=[]; lastScoreboardUpdate=Date.now(); return []; }
                const scoreMap = new Map();
                await Promise.all(files.filter(f=>f.name.endsWith('.txt')).map(async file => {
                    try {
                        const contentRes = await fetch(file.download_url);
                        if(!contentRes.ok) return;
                        const text = await contentRes.text();
                        const studentName = file.name.replace('.txt','');
                        let total = 0;
                        const blocks = text.split('-'.repeat(30));
                        for(const block of blocks){
                            if(!block.trim()) continue;
                            const lines = block.split('\n');
                            for(const line of lines){
                                if(line.includes('分数：')){
                                    const val = parseInt(line.replace('分数：','').trim());
                                    if(!isNaN(val)) total += val;
                                    break;
                                }
                            }
                        }
                        if(total !== 0 || blocks.length>0) scoreMap.set(studentName, total);
                    } catch(e){ console.warn(`解析${file.name}失败`,e); }
                }));
                const arr = Array.from(scoreMap.entries()).map(([n,s])=>({name:n, totalScore:s})).sort((a,b)=>b.totalScore - a.totalScore);
                scoreboardDataCache = arr;
                lastScoreboardUpdate = Date.now();
                return arr;
            } catch(e) {
                console.error("更新得分榜失败",e);
                return scoreboardDataCache;
            }
        }
        
        // 极速保存分数到GitHub（优化上传速度：单次请求，无SHA冗余前置检查，直接PUT覆盖式追加）
        async function saveScoreToGitHub(studentName, score) {
            const token = getGitHubToken();
            if (!token) { showSaveStatus(false, '❌ 请先设置GitHub Token'); speakText("请先设置GitHub Token"); return false; }
            if(!GITHUB_CONFIG.owner || GITHUB_CONFIG.owner==="YOUR_USERNAME") { showSaveStatus(false, 'GitHub配置无效'); return false; }
            
            const record = `姓名：${studentName}\n分数：${score}\n日期：${new Date().toLocaleString('zh-CN')}\n${'-'.repeat(30)}\n`;
            const filename = `records/${studentName}.txt`;
            
            // 极速上传: 先尝试获取文件sha (只请求一次)，若不存在则新建，减少轮次
            try {
                let sha = null;
                const checkUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${encodeURIComponent(filename)}`;
                const checkRes = await fetch(checkUrl, { headers: { 'Authorization': `token ${token}` } });
                if(checkRes.status === 200) {
                    const data = await checkRes.json();
                    sha = data.sha;
                } else if(checkRes.status !== 404) {
                    throw new Error("GitHub API错误");
                }
                
                // 获取现有内容（如果存在则追加）
                let existingContent = '';
                if(sha) {
                    const contentRes = await fetch(checkUrl, { headers: { 'Authorization': `token ${token}` } });
                    const fileData = await contentRes.json();
                    existingContent = decodeURIComponent(escape(atob(fileData.content)));
                }
                const newContent = existingContent + record;
                const encoded = btoa(unescape(encodeURIComponent(newContent)));
                
                const putRes = await fetch(checkUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Score update for ${studentName}`, content: encoded, sha: sha, branch: 'main' })
                });
                if(putRes.ok) {
                    showSaveStatus(true, `✅ ${studentName} 得分 ${score} 已上传服务器！`);
                    speakText(`${studentName}同学，得分${score}已上传服务器，得分榜已更新`);
                    showScoreAnimation(score);
                    // 立即强制刷新得分榜缓存（提高实时性）
                    await updateScoreboardCache(true);
                    return true;
                } else {
                    const err = await putRes.json();
                    showSaveStatus(false, `上传失败: ${err.message || '网络错误'}`);
                    return false;
                }
            } catch(err) {
                showSaveStatus(false, `上传异常: ${err.message}`);
                return false;
            }
        }
        
        // 渲染得分榜
        function renderScoreboard(data) {
            const container = document.getElementById('scoreboardData');
            if(!data || data.length===0) { container.innerHTML='<div class="loading-message">暂无得分数据</div>'; return; }
            let html = `<table class="scoreboard-table"><thead><tr><th>排名</th><th>姓名</th><th>总分</th></tr></thead><tbody>`;
            data.forEach((item,i)=> { html += `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.totalScore}</td></tr>`; });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        
        async function showScoreboard() {
            const modal = document.getElementById('scoreboardModal');
            modal.style.display = 'block';
            await updateScoreboardCache(true);
            renderScoreboard(scoreboardDataCache || []);
        }
        
        // ==================== 点名核心逻辑 ====================
        let isRolling = false, rollInterval = null, selectedStudent = '', audio = null;
        
        function stopRolling() {
            if(rollInterval) clearInterval(rollInterval);
            isRolling = false;
            const studentNameElement = document.getElementById('studentName');
            studentNameElement.classList.remove('rolling');
            const randomIndex = Math.floor(Math.random() * students.length);
            selectedStudent = students[randomIndex];
            selectStudent(selectedStudent);
        }
        
        function selectStudent(student) {
            selectedStudent = student;
            const nameEl = document.getElementById('studentName');
            nameEl.textContent = student;
            nameEl.classList.add('selected');
            if(audio) { audio.pause(); audio.currentTime = 0; }
            const imgEl = document.getElementById('studentImage');
            imgEl.src = `images/${student}.jpg`;
            imgEl.style.display = 'block';
            imgEl.classList.add('active');
            createFireworks();
            document.getElementById('message').textContent = `恭喜${student}同学中奖啦！`;
            speakText(`恭喜${student}同学中奖啦`);
            setTimeout(() => {
                imgEl.style.display = 'none';
                imgEl.classList.remove('active');
                document.getElementById('studentDisplay').classList.add('hidden');
                document.getElementById('imageContainer').classList.add('no-border');
                document.getElementById('studentNameInImage').textContent = student;
                document.getElementById('studentNameInImage').style.display = 'block';
                document.getElementById('scoreSection').style.display = 'block';
                document.getElementById('scoringStudent').textContent = student;
            }, 5000);
        }
        
        function createFireworks() {
            const celebration = document.getElementById('celebration');
            celebration.style.display = 'block';
            for(let i=0;i<40;i++) {
                setTimeout(()=>{
                    const fw = document.createElement('div');
                    fw.className = 'firework';
                    fw.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
                    fw.style.setProperty('--x', `${Math.random()*100}vw`);
                    fw.style.setProperty('--y', `${Math.random()*100}vh`);
                    celebration.appendChild(fw);
                    setTimeout(()=>fw.remove(),1500);
                }, i*80);
            }
            setTimeout(()=>celebration.style.display='none',4000);
        }
        
        function createStars() {
            const starsDiv = document.getElementById('stars');
            for(let i=0;i<150;i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = `${Math.random()*3+1}px`;
                s.style.height = s.style.width;
                s.style.left = `${Math.random()*100}%`;
                s.style.top = `${Math.random()*100}%`;
                s.style.animationDelay = `${Math.random()*2}s`;
                starsDiv.appendChild(s);
            }
        }
        
        // 头像预加载（静默）
        function preloadImages() {
            students.forEach(s => { const img = new Image(); img.src = `images/${s}.jpg`; });
        }
        
        // 启动定时自动刷新得分榜（每20秒静默更新后台缓存）
        let autoRefreshInterval = null;
        function startAutoRefreshScoreboard() {
            if(autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(async () => {
                if(getGitHubToken()) await updateScoreboardCache(true);
            }, 20000);
        }
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            const tokenToggle = document.getElementById('tokenToggle');
            const tokenSection = document.getElementById('githubTokenSection');
            tokenToggle.addEventListener('click', () => tokenSection.classList.toggle('collapsed'));
            document.getElementById('saveToken').addEventListener('click', () => {
                const token = document.getElementById('githubTokenInput').value.trim();
                if(token) saveGitHubToken(token);
                else showTokenStatus('请输入Token');
                document.getElementById('githubTokenInput').value = '';
                tokenSection.classList.add('collapsed');
            });
            const saved = getGitHubToken();
            if(saved) showTokenStatus('Token已就绪');
            
            // 填充下拉框
            const select = document.getElementById('studentSelect');
            students.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.textContent = s; select.appendChild(opt); });
            
            // 密码验证
            document.getElementById('submitPassword').addEventListener('click', () => {
                if(document.getElementById('passwordInput').value === 'math123') {
                    document.getElementById('passwordSection').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    preloadImages();
                    updateScoreboardCache(true);
                    startAutoRefreshScoreboard();
                } else alert('密码错误');
            });
            document.getElementById('passwordInput').addEventListener('keypress', e => { if(e.key === 'Enter') document.getElementById('submitPassword').click(); });
            
            // 点名控制
            document.getElementById('startBtn').addEventListener('click', () => {
                if(isRolling) return;
                isRolling = true;
                document.getElementById('studentImage').style.display = 'none';
                document.getElementById('studentNameInImage').style.display = 'none';
                document.getElementById('message').textContent = '';
                document.getElementById('scoreSection').style.display = 'none';
                document.getElementById('specifySection').style.display = 'none';
                document.getElementById('imageContainer').classList.remove('no-border');
                document.getElementById('studentDisplay').classList.remove('hidden');
                const nameEl = document.getElementById('studentName');
                nameEl.classList.remove('selected');
                nameEl.classList.add('rolling');
                audio = new Audio('music/background.mp3');
                audio.loop = true;
                audio.play().catch(e=>console.log);
                let idx = 0;
                rollInterval = setInterval(() => {
                    const r = Math.floor(Math.random() * students.length);
                    nameEl.textContent = students[r];
                }, 80);
                setTimeout(() => { if(isRolling) stopRolling(); }, 4000);
            });
            document.getElementById('stopBtn').addEventListener('click', () => { if(isRolling) stopRolling(); });
            document.getElementById('specifyBtn').addEventListener('click', () => { document.getElementById('specifySection').style.display = 'block'; });
            document.getElementById('confirmSpecify').addEventListener('click', () => {
                const v = document.getElementById('studentSelect').value;
                if(v) { selectStudent(v); document.getElementById('specifySection').style.display = 'none'; }
                else alert('请选择学生');
            });
            
            // 提交分数（极速上传+即时刷新得分榜）
            document.getElementById('submitScore').addEventListener('click', async () => {
                const scoreVal = document.getElementById('scoreInput').value;
                if(scoreVal === '' || isNaN(scoreVal) || scoreVal < -100 || scoreVal > 100) {
                    alert('请输入-100到100之间的整数分数');
                    return;
                }
                const scoreInt = parseInt(scoreVal);
                const studentNow = selectedStudent;
                if(!studentNow) return;
                const btn = document.getElementById('submitScore');
                btn.disabled = true;
                btn.textContent = '上传中...';
                const success = await saveScoreToGitHub(studentNow, scoreInt);
                btn.disabled = false;
                btn.textContent = '提交分数';
                if(success) {
                    document.getElementById('scoreInput').value = '';
                    document.getElementById('scoreSection').style.display = 'none';
                    document.getElementById('studentDisplay').classList.remove('hidden');
                    document.getElementById('studentNameInImage').style.display = 'none';
                    document.getElementById('imageContainer').classList.remove('no-border');
                    // 再次确保榜单立即更新并触发弹窗刷新（如果打开）
                    await updateScoreboardCache(true);
                    if(document.getElementById('scoreboardModal').style.display === 'block') {
                        renderScoreboard(scoreboardDataCache || []);
                    }
                }
            });
            
            // 得分榜事件
            document.getElementById('scoreboardBtn').addEventListener('click', showScoreboard);
            document.getElementById('refreshScoreboard').addEventListener('click', async () => { await updateScoreboardCache(true); renderScoreboard(scoreboardDataCache || []); });
            document.getElementById('downloadScoreboard').addEventListener('click', () => {
                if(!scoreboardDataCache || !scoreboardDataCache.length) { alert('暂无数据'); return; }
                let csv = '\uFEFF排名,姓名,总分\n';
                scoreboardDataCache.forEach((s,i)=> { csv += `${i+1},${s.name},${s.totalScore}\n`; });
                const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `得分榜_${new Date().toISOString().slice(0,19)}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
            });
            document.getElementById('closeScoreboard').addEventListener('click', () => { document.getElementById('scoreboardModal').style.display = 'none'; });
            document.getElementById('scoreboardModal').addEventListener('click', (e) => { if(e.target === document.getElementById('scoreboardModal')) document.getElementById('scoreboardModal').style.display = 'none'; });
        });
    </script>
